                  - type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                  - $ref: '#/components/schemas/UpdateStockItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - StockItems
      summary: Bulk partial-update StockItems (atomic)
      operationId: bulkPatchStockItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids, patch]
                  properties:
                    ids:
                      type: array
                      items: { type: string }
                    patch:
                      type: object
                      additionalProperties: true
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        required: [id, patch]
                        properties:
                          id: { type: string }
                          patch: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/stock_items/upsert:
    post:
      tags:
        - StockItems
      summary: Upsert StockItem
      operationId: upsertStockItem
      parameters:
        - name: key_field
          in: query
          schema:
            type: string
        - name: key_value
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockItemRequest'
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'

  /api/v1/stock_items/trash:
    get:
      tags:
        - StockItems
      summary: List deleted StockItems
      operationId: listDeletedStockItems
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItemList'

  /api/v1/stock_items/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags:
        - StockItems
      summary: Restore deleted StockItem
      operationId: restoreStockItem
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '404':
          $ref: '#/components/responses/NotFound'

