# inventory Module - Hooks Index
# Version: 2.0
#
# Module-level configuration for hooks (lifecycle behaviors).
# Hooks define: state machines, rules, permissions, triggers, computed fields.

module: inventory
version: 2

# Import all hook files.
imports:
  - inventory.hook.yaml
  - stock.hook.yaml

# =============================================================================
# Module-level configuration
# =============================================================================
config:
  audit:
    retention_days: 365
    archive_after_days: 90
    critical_events: []

  notifications:
    email_enabled: false
    sms_enabled: false
    push_enabled: false

# =============================================================================
# Shared domain events
# =============================================================================
events: {}

# =============================================================================
# Scheduled jobs
# =============================================================================
# run_scheduler (ADR-0020 posture declaration): the daily replenishment +
# reservation sweep. Pull posture — a plain interval-driven scan, no domain
# event re-arms it. commit_per_batch bounds the replay window: a crash
# mid-run re-orders at most one batch next run (never replays the whole day
# atomically). pickup_lock claims the scanned orderpoints/moves FOR UPDATE
# SKIP LOCKED so concurrent replicas never double-order the same orderpoint.
scheduled_jobs:
  run_scheduler:
    schedule: "0 1 * * *"
    handler: run_scheduler
    posture: pull
    commit_policy: commit_per_batch
    pickup_lock: true
