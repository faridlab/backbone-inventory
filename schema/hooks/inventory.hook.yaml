# =============================================================================
# inventory Hooks — document lifecycle + valuation/GL write-path rules.
# Declarative spec of behavior in src/application/service/inventory_write_service.rs,
# proven by tests/valuation_golden_cases.rs + tests/gl_posting_seam.rs.
# =============================================================================

module: inventory
version: 2

# -----------------------------------------------------------------------------
# State machines (movement documents)
# -----------------------------------------------------------------------------
state_machines:
  - entity: PurchaseReceipt
    field: status
    verbs: hand
    initial: draft
    states: [draft, submitted, cancelled]
    transitions:
      - { from: draft, to: submitted, on: submit }   # SLE in + Bin + asset post
  - entity: DeliveryNote
    field: status
    verbs: hand
    initial: draft
    states: [draft, submitted, cancelled]
    transitions:
      - { from: draft, to: submitted, on: submit }   # SLE out + Bin + COGS post
  - entity: StockReconciliation
    field: status
    verbs: hand
    initial: draft
    states: [draft, submitted, cancelled]
    transitions:
      - { from: draft, to: submitted, on: submit }   # SLE adjust + Bin + difference post

# -----------------------------------------------------------------------------
# Valuation + GL rules — each maps to a stable error_code + a golden case.
# -----------------------------------------------------------------------------
rules:
  - id: R1
    name: non_empty_document
    entity: PurchaseReceipt
    when: create
    enforced_by: "src/application/service/inventory_receipt.rs::create_purchase_receipt, src/application/service/inventory_delivery.rs::create_delivery_note, src/application/service/inventory_transfer.rs::create_picking, src/application/service/inventory_transfer.rs::submit_transfer, src/application/service/inventory_reconciliation.rs::submit_reconciliation"
    assert: "count(lines) >= 1"
    error_code: empty_document
  - id: R2
    name: non_negative
    entity: PurchaseReceiptItem
    enforced_by: "src/application/service/inventory_receipt.rs::create_purchase_receipt, src/application/service/inventory_delivery.rs::create_delivery_note, src/application/service/inventory_transfer.rs::submit_transfer, src/application/service/inventory_transfer.rs::create_picking, src/application/service/inventory_reconciliation.rs::submit_reconciliation, src/application/service/inventory_move_engine.rs::create_move"
    when: create
    assert: "line.quantity >= 0 AND line.rate >= 0"
    error_code: negative_quantity
  - id: R3
    name: sufficient_stock
    entity: DeliveryNote
    enforced_by: "src/application/service/inventory_delivery.rs::submit_delivery_note, src/application/service/inventory_transfer.rs::submit_transfer, src/application/service/inventory_move_engine.rs::action_done, src/application/service/inventory_move_engine.rs::mint_move_valuation"
    when: submit
    assert: "outgoing line.quantity <= bin.actual_qty"
    error_code: insufficient_stock
  - id: R4
    name: distinct_transfer_warehouses
    entity: StockEntry
    when: submit
    enforced_by: "src/application/service/inventory_transfer.rs::submit_transfer"
    assert: "from_warehouse_id != to_warehouse_id"
    error_code: same_warehouse
  - id: R5
    name: submit_once
    entity: PurchaseReceipt
    when: submit
    enforced_by: "src/application/service/inventory_delivery.rs::submit_delivery_note, src/application/service/inventory_receipt.rs::submit_purchase_receipt_into"
    assert: "document.status == 'draft'"
    error_code: not_draft
  - id: R6
    name: moving_average
    entity: StockLedgerEntry
    enforced_by: "src/application/service/inventory_move_engine.rs::mint_move_valuation"
    when: submit
    assert: "receipt blends rate = value/qty; outflow keeps rate, cogs = qty*rate"
    error_code: null
  - id: R7
    name: balanced_post
    entity: StockMove
    justification: "NOT ENFORCED in a release build: every posting envelope is balanced by construction, and the only check is a debug_assert! in inventory_write_service.rs emit_and_reconcile and inventory_move_engine.rs action_done, which release builds compile out."
    when: submit
    assert: "sum(lines.debit) == sum(lines.credit)"
    error_code: unbalanced

# -----------------------------------------------------------------------------
# Domain events (emitted via InventoryEventSink after commit).
#
# `company_id` in every payload below is the legacy twin (ADR-0029): filled from
# the ambient org scope's company echo for consumers that still read a tenant
# off the wire. No module statement keys on it.
# -----------------------------------------------------------------------------
events:
  StockReceived:
    when: "a purchase receipt is submitted"
    payload: [receipt_id, company_id, warehouse_id, source_po_id, total_value]
  StockDelivered:
    when: "a delivery note is submitted"
    payload: [delivery_id, company_id, warehouse_id, source_so_id, total_cogs]
  StockMoved:
    when: "a stock transfer is submitted"
    payload: [entry_id, company_id, from_warehouse_id, to_warehouse_id]
  StockReconciled:
    when: "a stock reconciliation is submitted"
    payload: [reconciliation_id, company_id, warehouse_id, net_difference]
  LandedCostValidated:
    when: "a landed cost is validated (cost lines allocated, remaining-share revaluation minted)"
    payload: [lc_id, company_id, target_receipt_id, amount_total, revalued_value]
