# =============================================================================
# inventory Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA inventory` and qualify tables
# as `inventory.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: inventory
version: 2
schema: inventory
description: "Inventory: append-only Stock Ledger (SLE) + moving-average valuation + Bin balances. Delivery Note emits COGS (Dr COGS - Cr Inventory) and Purchase Receipt emits asset (Dr Inventory - Cr GR/IR) AccountingPosts into backbone-accounting via the GL-posting contract."

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model (parents before children).
imports:
  - warehouse.model.yaml
  - stock_ledger.model.yaml
  - stock_entry.model.yaml
  - purchase_receipt.model.yaml
  - delivery_note.model.yaml
  - stock_reconciliation.model.yaml
