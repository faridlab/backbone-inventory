# =============================================================================
# inventory Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA inventory` and qualify tables
# as `inventory.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: inventory
version: 2
schema: inventory

# -----------------------------------------------------------------------------
# Company fence (ADR-0014) — module-level declaration; the DSL admits exactly
# one per module, so the per-entity posture is realized by column nullability:
#
#   shared_blank  : nullable company_id — NULL rows are first-class shared rows
#                   (the port of Odoo's `[False]` escape). Applies to MASTER
#                   DATA: Location, Lot, Package, Route, RouteRule,
#                   OperationType.
#   strict        : NOT NULL company_id — the `company_id IS NULL` arm of the
#                   shared_blank predicate is dead on these tables, making
#                   them behaviorally strict. Applies to TRANSACTIONS and
#                   their configuration rows: Warehouse, StockItem, Transfer,
#                   StockMove, StockMoveLine, Quant, ReorderingRule, Bin,
#                   StockLedgerEntry, and every voucher header/line.
#
# Posture map (entity -> realized fence, all under this one declaration):
#   Warehouse            -> strict (@required company_id)
#   StockItem            -> strict
#   Location             -> shared_blank (shared supplier/customer root trees)
#   Lot                  -> shared_blank
#   Package              -> shared_blank (company derived from location chain)
#   Route                -> shared_blank (global MTO route seeds NULL)
#   RouteRule            -> shared_blank
#   OperationType        -> shared_blank (global virtual adjustment type)
#   ReorderingRule       -> strict (company in the unique key)
#   Transfer             -> strict (mirrors the type's company)
#   StockMove            -> strict
#   StockMoveLine        -> strict
#   Quant                -> strict (company derived from location chain)
#   StockLedgerEntry     -> strict
#   Bin                  -> strict
#   vouchers x4 + lines  -> strict
#   InventoryCompanySetting -> strict (settings are per-company by definition —
#                           NOT NULL company_id, one row per company, no
#                           shared_blank escape)
#   LandedCost + lines   -> strict (the LC books in its acting company)
# -----------------------------------------------------------------------------
company_fence: shared_blank

description: "Inventory: quant-driven stock (one quant per item x location x lot x package x owner; reserved_quantity authoritative) + 7-state stock moves projected onto transfer documents + append-only Stock Ledger (SLE) with moving-average valuation. Vouchers (PurchaseReceipt / DeliveryNote / StockEntry / StockReconciliation) mint Transfers grouping moves; move _action_done writes the SLE rows and GL legs (Dr Inventory - Cr GR/IR on receipt, Dr COGS - Cr Inventory on delivery) into backbone-accounting via the GL-posting contract."

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model (parents before children).
imports:
  - warehouse.model.yaml
  - location.model.yaml
  - tracking.model.yaml
  - operation.model.yaml
  - procurement.model.yaml
  - move.model.yaml
  - quant.model.yaml
  - stock_ledger.model.yaml
  - stock_entry.model.yaml
  - purchase_receipt.model.yaml
  - delivery_note.model.yaml
  - stock_reconciliation.model.yaml
  - inventory_company_setting.model.yaml
  - landed_cost.model.yaml
