# =============================================================================
# Domain: Inventory
# Entity: DeliveryNote (+ DeliveryNoteItem)
# Description: Outbound delivery. On submit → SLE outgoing (qty -, consuming the
# current moving-average valuation) → Bin updated → emits AccountingPost
# (Dr COGS · Cr Inventory) for the consumed value. customer_id / source SO / item
# are logical FKs; cogs/inventory accounts are logical FKs to accounting.Account.
# =============================================================================

models:
  - name: DeliveryNote
    collection: delivery_notes
    description: "Outbound delivery; emits a COGS (Dr COGS · Cr Inventory) post on submit"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique delivery identifier"

      delivery_number:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Human reference (the post's voucher_no)"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books/stock owner # logical FK to organization.Company.id"

      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Branch # logical FK to organization.Branch.id"

      customer_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Customer # logical FK to party.Party.id"

      source_so_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Source sales order # logical FK to selling.SalesOrder.id"

      warehouse_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Warehouse.id)"]
        description: "Source warehouse"

      posting_date:
        type: date
        attributes: ["@required"]
        description: "Delivery / posting date"

      total_cogs:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ consumed value across lines (computed at post from valuation) — the COGS debit"

      # ---- GL account refs (logical FKs to accounting.Account) ----
      cogs_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "COGS (expense) account to debit # logical FK to accounting.Account.id"

      inventory_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Inventory (asset) account to credit # logical FK to accounting.Account.id"

      status:
        type: DocStatus
        attributes: ["@default(draft)"]
        description: "Document lifecycle"

      posting_state:
        type: GlPostingState
        attributes: ["@default(pending)"]
        description: "GL reconciliation state"

      journal_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Resulting journal # logical FK to accounting.Journal.id"

      accounting_post_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The AccountingPost record # logical FK to accounting.AccountingPost.id"

      posted_at:
        type: datetime?
        description: "When the GL post was confirmed"

      notes:
        type: string?
        attributes: ["@max(1000)"]
        description: "Free-text notes"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      items:
        type: DeliveryNoteItem[]
        attributes: ["@one_to_many"]
        description: "Delivered lines"
        inverse: delivery

    indexes:
      - type: unique
        fields: [delivery_number]
        where: "deleted_at IS NULL"
      - type: index
        fields: [company_id, customer_id, status]
      - type: index
        fields: [posting_state]

  - name: DeliveryNoteItem
    collection: delivery_note_items
    description: "One delivered line (qty; COGS computed at post from current valuation)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique line id"

      delivery_id:
        type: uuid
        attributes: ["@required", "@foreign_key(DeliveryNote.id)"]
        description: "Owning delivery note"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Books/stock owner # logical FK to organization.Company.id; denormalized from DeliveryNote to FORCE RLS on the child (ADR-0010 Decision A)"

      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id"

      quantity:
        type: decimal
        attributes: ["@required", "@precision(18,4)", "@non_negative"]
        description: "Delivered quantity"

      valuation_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,6)", "@non_negative"]
        description: "Moving-average rate consumed (snapshot at post)"

      cogs_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "quantity * valuation_rate at post (2dp)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      delivery:
        type: DeliveryNote
        attributes: ["@one", "@foreign_key(delivery_id)"]
        description: "Owning delivery note"
        inverse: items

    indexes:
      - type: index
        fields: [delivery_id]
