# =============================================================================
# Domain: Inventory
# Entity: StockLedgerEntry (SLE) + Bin
# Description: The SLE is the append-only quantity+valuation ledger — inventory's
# equivalent of the GL. Every stock movement writes one SLE per (item, warehouse);
# every valuation-changing SLE becomes an AccountingPost. Bin is the running
# per-(item, warehouse) balance (moving-average rate + value), updated in lockstep.
# SLE rows are IMMUTABLE (append-only); corrections are new entries, never edits.
# =============================================================================

models:
  - name: StockLedgerEntry
    collection: stock_ledger_entries
    description: "Append-only quantity + valuation ledger entry (the spine)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique SLE identifier"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning company # logical FK to organization.Company.id"

      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id"

      warehouse_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Warehouse.id)"]
        description: "Warehouse the movement hit"

      posting_date:
        type: date
        attributes: ["@required"]
        description: "Business date of the movement"

      # Signed movement quantity (+ in, - out).
      actual_qty:
        type: decimal
        attributes: ["@required", "@precision(18,4)"]
        description: "Signed quantity moved (+ incoming, - outgoing)"

      qty_after_txn:
        type: decimal
        attributes: ["@required", "@precision(18,4)"]
        description: "Running balance quantity after this entry"

      incoming_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,6)", "@non_negative"]
        description: "Unit cost of an incoming movement (0 for outgoing)"

      valuation_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,6)", "@non_negative"]
        description: "Moving-average unit cost after this entry"

      stock_value:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)"]
        description: "Running total value after this entry (qty_after_txn * valuation_rate, 2dp)"

      stock_value_difference:
        type: decimal
        attributes: ["@required", "@precision(18,2)"]
        description: "Value delta of this entry (the amount posted to the GL)"

      voucher_type:
        type: VoucherType
        attributes: ["@required"]
        description: "Kind of source voucher"

      voucher_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Source voucher id (delivery note / purchase receipt / stock entry / reconciliation)"

      voucher_no:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Human voucher reference"

      sle_no:
        type: int
        attributes: ["@required"]
        description: "Sequence of this SLE within its voucher (part of the idempotency key)"

      is_cancelled:
        type: bool
        attributes: ["@default(false)"]
        description: "Reversed by a later correcting entry"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [company_id, item_id, warehouse_id, posting_date]
      - type: index
        fields: [voucher_type, voucher_id]
      - type: unique
        fields: [voucher_type, voucher_id, sle_no]
        where: "deleted_at IS NULL"

  - name: Bin
    collection: bins
    description: "Running per-(item, warehouse) balance: qty + moving-average rate + value"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique bin identifier"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning company # logical FK to organization.Company.id"

      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id"

      warehouse_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Warehouse.id)"]
        description: "Warehouse"

      actual_qty:
        type: decimal
        attributes: ["@default(0)", "@precision(18,4)"]
        description: "On-hand quantity"

      reserved_qty:
        type: decimal
        attributes: ["@default(0)", "@precision(18,4)", "@non_negative"]
        description: "Soft-reserved quantity (against sales orders)"

      valuation_rate:
        type: decimal
        attributes: ["@default(0)", "@precision(18,6)", "@non_negative"]
        description: "Current moving-average unit cost"

      stock_value:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)"]
        description: "Current total value (actual_qty * valuation_rate, 2dp)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: unique
        fields: [company_id, item_id, warehouse_id]
        where: "deleted_at IS NULL"

# =============================================================================
# Enums
# =============================================================================

enums:
  - name: VoucherType
    description: "Kind of source voucher that produced an SLE"
    variants:
      - name: purchase_receipt
        description: "Inbound goods receipt"
        default: true
      - name: delivery_note
        description: "Outbound delivery"
      - name: stock_entry
        description: "Internal transfer / repack / issue / receipt"
      - name: stock_reconciliation
        description: "Physical-count adjustment"
