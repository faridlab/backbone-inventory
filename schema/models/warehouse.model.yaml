# =============================================================================
# Domain: Inventory
# Entity: Warehouse (+ StockItem projection)
# Description: Warehouse is the one master this pillar owns — a per-company tree
# (parent/is_group). StockItem is a read-only ACL projection of catalog.Item
# (never the god-entity), refreshed by ItemCreated/Updated events.
# =============================================================================

models:
  - name: Warehouse
    collection: warehouses
    description: "A storage location (tree) scoped to an org-tree node. Group nodes hold no stock. Org-scoped per ADR-0028: warehouses hang off a company or branch node; the fence is the session's entitlement-union over org_unit ids."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique warehouse identifier"

      org_unit_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning org-tree node # logical FK to organization.OrgUnit.id; must be a company or branch node (write-path trigger + service validator reject root/unknown ids)"

      code:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Short unique code"

      name:
        type: string
        attributes: ["@required", "@max(150)"]
        description: "Warehouse name"

      warehouse_type:
        type: WarehouseType
        attributes: ["@default(stock)"]
        description: "Functional type"

      parent_warehouse_id:
        type: uuid?
        attributes: ["@foreign_key(Warehouse.id)"]
        description: "Parent node (tree); null = root"

      is_group:
        type: bool
        attributes: ["@default(false)"]
        description: "A grouping node — holds no stock, only children"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: unique
        fields: [org_unit_id, code]
        where: "deleted_at IS NULL"
      - type: unique
        fields: [org_unit_id, name]
        where: "deleted_at IS NULL"
        description: "R1 — warehouse name unique per org node (the code half and the name half are both unique)"
      - type: index
        fields: [org_unit_id]
      - type: index
        fields: [parent_warehouse_id]

  - name: StockItem
    collection: stock_items
    description: "ACL projection of catalog.Item — the stock-relevant slice (never owns the Item)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique projection row id"

      item_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Catalog item # logical FK to catalog.Item.id (unique per company)"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning company # logical FK to organization.Company.id"

      stock_uom:
        type: string
        attributes: ["@required", "@max(20)"]
        description: "Stock-keeping unit of measure (from catalog)"

      is_stock_item:
        type: bool
        attributes: ["@default(true)"]
        description: "Tracked in the stock ledger (false = service/non-stock)"

      has_batch:
        type: bool
        attributes: ["@default(false)"]
        description: "Movements require a batch (batch tracking)"

      valuation_method:
        type: ValuationMethod
        attributes: ["@default(moving_average)"]
        description: "Cost method (moving-average). FIFO was a declared-but-unimplemented option and has been removed (council 2026-07-29); re-add only when the FIFO engine ships."

      reorder_level:
        type: decimal
        attributes: ["@default(0)", "@precision(18,4)", "@non_negative"]
        description: "Reorder trigger level (emits ReorderLevelBreached)"

      weight_per_unit:
        type: decimal
        attributes: ["@default(0)", "@precision(18,6)", "@non_negative"]
        description: "Per-unit shipping weight — the weight basis of landed-cost splits (0 = unweighted; an all-zero weight basis is the loud zero-denominator case)"

      service_tracking:
        type: ServiceTrackingType
        attributes: ["@default(manual)"]
        description: "What a selling-order confirm mints for a service item (task / project / nothing). Default manual: an existing service item mints nothing until deliberately configured."

      service_project_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Fixed project for task_global_project # logical FK to project.Project.id"

      service_project_template_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Project blueprint for task_in_project / project_only forking # logical FK to project.ProjectTemplate.id"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: unique
        fields: [company_id, item_id]
        where: "deleted_at IS NULL"

# =============================================================================
# Enums
# =============================================================================

enums:
  - name: WarehouseType
    description: "Functional warehouse type"
    variants:
      - name: stock
        description: "General stock"
        default: true
      - name: transit
        description: "In-transit"
      - name: wip
        description: "Work in progress"
      - name: finished_goods
        description: "Finished goods"
      - name: rejected
        description: "Rejected / quarantine"

  - name: ValuationMethod
    description: "Inventory cost method"
    variants:
      - name: moving_average
        description: "Weighted moving average (SMB default)"
        default: true

  - name: ServiceTrackingType
    description: "What a selling-order confirm mints for a service item"
    variants:
      - name: task_global_project
        description: "One task per sale line under the fixed service project"
      - name: task_in_project
        description: "One project per order, one task per sale line"
      - name: project_only
        description: "One project per order, no tasks"
      - name: manual
        description: "Nothing minted (safe default — minting must be deliberate)"
        default: true
