# Seed Execution Order Configuration
# Seeds are executed in the order defined in this file.
# This ensures foreign key dependencies are satisfied.

# Format: seed_name_seed (without .sql extension)
#
# Note: You can manually edit this file to customize the order.
# Seeds not listed here will be executed after in alphabetical order.

