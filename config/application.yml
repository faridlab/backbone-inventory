server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/inventory.log
module:
  name: inventory
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  delivery_note:
    collection: delivery_notes
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  delivery_note_item:
    collection: delivery_note_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  purchase_receipt:
    collection: purchase_receipts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  purchase_receipt_item:
    collection: purchase_receipt_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  stock_entry:
    collection: stock_entries
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  stock_entry_item:
    collection: stock_entry_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  stock_ledger_entry:
    collection: stock_ledger_entries
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  bin:
    collection: bins
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  stock_reconciliation:
    collection: stock_reconciliations
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  stock_reconciliation_item:
    collection: stock_reconciliation_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  warehouse:
    collection: warehouses
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  stock_item:
    collection: stock_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
